stages:
  - verify

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

verification:
  stage: verify
  image: python:3.12-slim
  script:
    - python --version
    - python -m pip install -e ".[dev]"
    - ruff check .
    - pytest -q
    - termivance status
    - termivance status --json
    - termivance doctor
    - termivance policy-check config/retirement_policy.example.json
    # Network-free proof that the only mutation allowlist excludes project deletion.
    - python -c "from termivance.pages import mutation_is_structurally_safe as s; assert s(), 'mutation allowlist unsafe'"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
