<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Termivance Control Room</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #10151c; --line: #30363d;
    --ink: #e6edf3; --dim: #9aa7b4; --ok: #3fb950; --warn: #d29922;
    --bad: #f85149; --accent: #58a6ff; --amber: #db6d28; --violet: #bc8cff;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 "Segoe UI", system-ui, sans-serif; }
  header { padding: 14px 26px; border-bottom: 1px solid var(--line);
           display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 19px; margin: 0; letter-spacing: .3px; }
  header .sub { color: var(--dim); font-size: 12.5px; width: 100%; }
  .chip { display: inline-block; padding: 2px 11px; border-radius: 999px;
          font-size: 12px; font-weight: 600; border: 1px solid var(--line);
          white-space: nowrap; }
  .chip.ok   { color: var(--ok); }
  .chip.warn { color: var(--warn); }
  .chip.bad  { color: var(--bad); }
  .chip.dim  { color: var(--dim); }
  .chip.acc  { color: var(--accent); border-color: #1f4c7a; }
  .chip.amber{ color: var(--amber); border-color: #6b3a17; }
  .chip.violet { color: var(--violet); }
  nav { display: flex; gap: 8px; padding: 10px 26px 0; flex-wrap: wrap; }
  .tabbtn { background: var(--panel2); color: var(--dim); border: 1px solid var(--line);
            border-bottom: none; border-radius: 8px 8px 0 0; padding: 8px 16px;
            font: inherit; font-weight: 600; cursor: pointer; }
  .tabbtn.active { color: var(--ink); background: var(--panel); }
  .panel { display: none; padding: 16px 26px 30px; }
  .panel.active { display: block; }
  .grid { display: grid; grid-template-columns: 1.35fr .95fr; gap: 16px; }
  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .card h2 { font-size: 15px; margin: 0 0 8px; letter-spacing: .3px; }
  .card h3 { font-size: 13px; color: var(--dim); margin: 12px 0 6px; }
  .muted { color: var(--dim); font-size: 13px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; font-size: 13.5px; }
  .kv dt { color: var(--dim); } .kv dd { margin: 0; word-break: break-word; }
  select, .btn { background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
                 border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13.5px; }
  .btn { cursor: pointer; }
  .btn.on { color: var(--ink); border-color: var(--accent); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid var(--line); padding: 5px 9px; text-align: left;
           vertical-align: top; }
  th { color: var(--dim); font-weight: 600; background: var(--panel2); }
  .res { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
         margin: 6px 0; background: var(--panel2); cursor: pointer; font-size: 13.5px; }
  .res:hover { border-color: var(--accent); }
  .res.sel { border-color: var(--accent); background: #101d2c; }
  .res .ref { font-family: Consolas, monospace; font-size: 12.5px; color: var(--accent); }
  #graph-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 10px;
                background: var(--panel2); }
  svg { display: block; }
  .lnode { cursor: pointer; }
  .lnode rect { fill: #12161d; stroke-width: 2; }
  .lnode text { fill: var(--ink); font-size: 11px; font-family: "Segoe UI", sans-serif; }
  .lnode.dim { opacity: .28; }
  .ledge { stroke: #6e7681; stroke-width: 1.4; fill: none; }
  .ledge.obs { stroke: var(--accent); stroke-width: 1.8; }
  .ledge.inf { stroke: var(--amber); stroke-dasharray: 5 4; }
  .ledge.hot { stroke: var(--ok); stroke-width: 2.4; }
  .ledge.dim { opacity: .18; }
  .lagend { font-size: 12px; fill: var(--dim); }
  pre { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
        padding: 10px 12px; overflow: auto; font-size: 12.5px; color: #c9d1d9; }
  code { font-family: Consolas, monospace; }
  .factor { border-left: 3px solid var(--amber); padding: 6px 12px; margin: 8px 0;
            background: var(--panel2); border-radius: 0 8px 8px 0; font-size: 13.5px; }
  ul.tight { margin: 6px 0; padding-left: 22px; font-size: 13.5px; }
  .banner { border: 1px dashed var(--warn); color: var(--warn); border-radius: 8px;
            padding: 7px 12px; font-weight: 600; font-size: 13px; margin-bottom: 10px; }
  footer { border-top: 1px solid var(--line); padding: 14px 26px 26px; color: var(--dim);
           font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <h1>Termivance Control Room</h1>
  <span id="hdr-chips"></span>
  <div class="sub" id="hdr-sub"></div>
</header>
<nav id="tabs">
  <button class="tabbtn active" data-tab="portfolio">Portfolio &amp; resources</button>
  <button class="tabbtn" data-tab="graph">Dependency &amp; risk graph</button>
  <button class="tabbtn" data-tab="whatif">What-if (read-only)</button>
  <button class="tabbtn" data-tab="proof">Proof, gates &amp; evidence</button>
</nav>

<section class="panel active" id="tab-portfolio"></section>
<section class="panel" id="tab-graph">
  <div class="grid">
    <div>
      <div class="card">
        <h2>Interaction</h2>
        <span class="muted">Click a node to highlight its edges and see its recorded
        payload. Use the buttons to zoom. This graph is rendered from the recorded
        risk map only — it has no live connection to GitLab.</span>
        <p>
          <button class="btn" id="zoom-out">− zoom out</button>
          <button class="btn" id="zoom-in">+ zoom in</button>
          <button class="btn" id="zoom-reset">reset</button>
          <button class="btn" id="graph-clear">clear highlight</button>
        </p>
        <p class="muted" id="graph-stats"></p>
      </div>
      <div id="graph-wrap"></div>
    </div>
    <div class="card" id="graph-detail">
      <h2>Node details</h2>
      <span class="muted">Select a node in the graph.</span>
    </div>
  </div>
</section>
<section class="panel" id="tab-whatif"></section>
<section class="panel" id="tab-proof"></section>

<footer id="footer"></footer>

<script src="data.js"></script>
<script>
"use strict";
/* Termivance Control Room — static read-only viewer.
   Everything is rendered from window.TERMIVANCE_DATA (recorded artifacts).
   No fetch(), no eval, no mutation endpoints: this page can trigger nothing. */

const D = window.TERMIVANCE_DATA || {};
const escapeHtml = (v) => String(v ?? "")
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

function chipState(state) {
  const s = String(state ?? "");
  if (/^(OBSERVED|PRESENT|OK|SATISFIED|AVAILABLE|LIVE_ANONYMOUS|RECORDED_LIVE|SUPPORTED|CORROBORATED|DETERMINISTIC)/.test(s)) return "chip ok";
  if (/^INFERRED|^PROJECTED|^STALE|^UNRESOLVED|^OPERATOR_CONFIRMED|^PROCEDURAL/.test(s)) return "chip amber";
  if (/^(NOT_RUN|NOT_OBSERVED|VIOLATED|REFUSED|BLOCKED|ABSENT|CONTRADICTED|NOT_AUTHENTICALLY)/.test(s)) return "chip bad";
  if (/^(UNAVAILABLE|UNKNOWN|UNSUPPORTED|NOT_CHECKED|CONTEXTUAL)/.test(s)) return "chip dim";
  if (/^(NOT_AUTHORIZING|READ_ONLY|READ_ONLY_OBSERVATION|AUTHORIZED_FALSE|STRUCTURALLY_REFUSED|DUO_AUTONOMOUS)/.test(s)) return "chip violet";
  /* QA-FIX D: receipt truth states. Provider acceptance is a recorded fact but
     never absence (amber); incoherence is a defect, never evidence (red). */
  if (/^MUTATION_ACCEPTED/.test(s)) return "chip amber";
  if (/^(INVALID|ATTEMPT_NOT_ACCEPTED|MALFORMED)/.test(s)) return "chip bad";
  /* Witness truth states: an observed mechanism is a live counterexample
     (amber); an unobserved config is unknown, never safe (dim). */
  if (/^MECHANISM_PRESENT|^MECHANISM_NOT_FOUND/.test(s)) return "chip amber";
  if (/^CONFIG_NOT_OBSERVED/.test(s)) return "chip dim";
  return "chip acc";
}
const chip = (label, cls) => `<span class="${cls || chipState(label)}">${escapeHtml(label)}</span>`;

function kv(pairs) {
  return `<dl class="kv">${pairs.map(([k, v]) =>
    `<dt>${escapeHtml(k)}</dt><dd>${v}</dd>`).join("")}</dl>`;
}
function sub(label) { return `<h3>${escapeHtml(label)}</h3>`; }
function missing(name) {
  return `<div class="card"><h2>${escapeHtml(name)}</h2>${chip("UNAVAILABLE", "chip dim")}
    <span class="muted"> — the artifact was not supplied to the builder; it is
    deliberately not invented here.</span></div>`;
}

/* ---------- header ---------- */
function renderHeader() {
  const prov = D.read_provenance || "UNAVAILABLE";
  const mut = D.mutation_status || "UNAVAILABLE";
  document.getElementById("hdr-chips").innerHTML =
    `${chip("EVIDENCE: " + prov)} ${chip("MUTATION: " + mut)}
     ${chip("CONTROL ROOM: " + String(D.schema || "v2"))}`;
  document.getElementById("hdr-sub").textContent =
    "Recorded artifacts only — built " + String(D.built_at || "unknown") +
    " by " + String(D.generated_by || "unknown") +
    " · no network fetch at view time · no destructive control exists on this page";
}

/* ---------- portfolio tab ---------- */
let selectedAsset = null;
let selectedResource = null;

function assets() { return (D.sections && D.sections.portfolio && Array.isArray(D.sections.portfolio.assets)) ? D.sections.portfolio.assets : []; }
function totals() { return (D.sections && D.sections.portfolio && D.sections.portfolio.totals) || {}; }

function resourceRows(asset) {
  const rs = asset.resources || [];
  if (!rs.length) return `<p class="muted">No resource records for this asset.</p>`;
  return rs.map((r) => `
    <div class="res ${selectedResource === r.ref ? "sel" : ""}" data-ref="${escapeHtml(r.ref)}">
      <div>${chip(r.kind, "chip acc")} ${chip(r.state)} ${chip("support: " + (r.support || "—"))}
        ${chip(r.mutation_capability)}</div>
      <div class="ref">${escapeHtml(r.ref)}</div>
      <div class="muted">GET ${escapeHtml(r.endpoint)} · observed ${escapeHtml(r.observed_at)} · fresh until ${escapeHtml(r.fresh_until)} · ${escapeHtml(r.provenance)}</div>
      <div class="muted">detail: ${escapeHtml(Object.entries(r.detail || {}).map(([k, v]) => k + "=" + JSON.stringify(v)).join(", "))}</div>
    </div>`).join("");
}

function renderPortfolio() {
  const el = document.getElementById("tab-portfolio");
  const pf = D.sections && D.sections.portfolio;
  if (!pf || !pf.assets) { el.innerHTML = missing("Portfolio"); return; }
  const t = totals();
  el.innerHTML = `
  <div class="grid">
    <div>
      <div class="card">
        <h2>Observed assets (${escapeHtml(pf.assets.length)}) — pick one to inspect its resources</h2>
        <p>${pf.assets.map((a) => `
          <button class="btn ${selectedAsset === a.project_id ? "on" : ""}" data-asset="${a.project_id}">
            ${escapeHtml(a.project_id)} · ${escapeHtml((a.full_path || "").split("/").pop())}
          </button>`).join(" ")}
        </p>
        ${kv([
          ["provenance", chip(pf.provenance || "UNAVAILABLE")],
          ["pages sites present", escapeHtml(t.pages_sites ?? "—")],
          ["pages unverifiable (401/403)", escapeHtml(t.pages_unverifiable ?? "—")],
          ["pages endpoint NOT observed (404 — never absence)", escapeHtml(t.pages_not_observed ?? "—")],
          ["resources observed", escapeHtml(t.resources_observed ?? "—")],
          ["resources NOT observed", escapeHtml(t.resources_not_observed ?? "—")],
          ["observed / inferred relations", escapeHtml(t.observed_relations ?? "—") + " / " + escapeHtml(t.inferred_relations ?? "—")],
        ])}
      </div>
      <div class="card" id="asset-card"></div>
      <div class="card"><h2>Relations from the same snapshot</h2>
        <div id="relations"></div>
      </div>
    </div>
    <div>
      <div class="card">
        <h2>Portfolio counts by kind</h2>
        <table><tr><th>kind</th><th>count</th></tr>
        ${Object.entries(t.resource_kinds_observed || {}).map(([k, v]) =>
          `<tr><td>${escapeHtml(k)}</td><td>${escapeHtml(v)}</td></tr>`).join("") ||
          "<tr><td colspan=2>none observed</td></tr>"}
        </table>
        <p class="muted">Every resource record carries mutation_capability =
        ${chip("NOT_AUTHORIZING")}: discovery of these facts is not an
        authorization to change anything.</p>
      </div>
      <div class="card"><h2>Support legend</h2>
        ${chip("OBSERVED")} <span class="muted">provider-returned fact at an exact endpoint</span><br>
        ${chip("INFERRED", "chip amber")} <span class="muted">reasoned link between observed facts — never decision evidence</span><br>
        ${chip("NOT_OBSERVED")} <span class="muted">401/403/404 or missing data — never absence</span><br>
        ${chip("NOT_RUN")} <span class="muted">an action the runtime did not perform</span>
      </div>
    </div>
  </div>`;
  renderAsset();
  el.querySelectorAll("[data-asset]").forEach((b) =>
    b.addEventListener("click", () => { selectedAsset = Number(b.dataset.asset); selectedResource = null; renderPortfolio(); }));
  el.querySelectorAll("[data-ref]").forEach((n) =>
    n.addEventListener("click", () => { selectedResource = n.dataset.ref; renderPortfolio(); }));
}

function renderAsset() {
  const card = document.getElementById("asset-card");
  const rel = document.getElementById("relations");
  const a = assets().find((x) => x.project_id === selectedAsset) || assets()[0];
  selectedAsset = a ? a.project_id : null;
  if (!a) { card.innerHTML = `<p class="muted">No assets recorded.</p>`; }
  else {
    card.innerHTML = `
      <h2>${escapeHtml(a.project_id)} — ${escapeHtml(a.full_path || "")}</h2>
      ${chip("PAGES: " + (a.pages_state || "—"))}
      ${kv([
        ["role", escapeHtml(a.role || "—")],
        ["visibility", escapeHtml(a.visibility || "—")],
        ["archived", escapeHtml(String(a.archived))],
        ["web url", a.web_url ? `<a href="${escapeHtml(a.web_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(a.web_url)}</a>` : "—"],
        ["observed at", escapeHtml(a.observed_at || "—")],
        ["provenance", chip(a.provenance || "—")],
      ])}
      ${sub("Resource records (click one)")}
      ${resourceRows(a)}`;
  }
  const relations = (D.sections.portfolio.relations || []);
  rel.innerHTML = relations.length ? relations.map((r) => `
    <div class="res">
      ${chip(r.kind, "chip acc")} ${chip("support: " + (r.support || "—"))}
      <div class="ref">${escapeHtml(r.src)} → ${escapeHtml(r.dst)}</div>
    </div>`).join("") : `<p class="muted">No relations recorded.</p>`;
}

/* ---------- graph tab ---------- */
let layout = null;      // {nodes:[{id,x,y,w,h,node}], edges:[{...}]}
let selectedNode = null;
let zoom = 1;

function nodeClass(kind, id) {
  if (id.startsWith("resource-unobserved:")) return "unobs";
  if (kind === "RISK") return "risk";
  if (kind === "CONTROL") return "control";
  if (kind === "DEPENDENCY") return "dep";
  return "other";
}
const NODE_COLORS = { risk: "#f85149", control: "#58a6ff", dep: "#3fb950",
                      unobs: "#db6d28", other: "#9aa7b4" };

function computeLayout() {
  const rm = D.sections && D.sections.risk_map;
  if (!rm || !Array.isArray(rm.nodes)) return null;
  const seen = new Set();
  const nodes = [];
  for (const n of rm.nodes) {
    if (seen.has(n.node_id)) continue;   // torn-read guard, keeps first
    seen.add(n.node_id);
    nodes.push(n);
  }
  const edges = (rm.edges || []).filter((e) =>
    nodes.some((n) => n.node_id === e.src) && nodes.some((n) => n.node_id === e.dst));
  const isDecision = (id) => !(id.startsWith("resource") || id.startsWith("not-observed:"));
  const W = 168, H = 46, GAP = 18, ROW = H + 46;
  const cl = nodes.filter((n) => isDecision(n.node_id));
  const cx = nodes.filter((n) => !isDecision(n.node_id));
  const columns = [
    cl.filter((n) => n.node_id.startsWith("obligation-")),
    cl.filter((n) => n.node_id.startsWith("obl:")),
    cl.filter((n) => n.node_id.startsWith("risk:") || n.node_id.startsWith("control:")),
  ];
  const pos = new Map();
  let x = 30;
  for (const col of columns) {
    col.forEach((n, i) => pos.set(n.node_id, { x: x, y: 46 + i * ROW }));
    x += W + GAP + 96;
  }
  // cross-resource nodes: grid below the decision cluster
  const perRow = 5;
  cx.forEach((n, i) => {
    pos.set(n.node_id, {
      x: 30 + (i % perRow) * (W + GAP),
      y: 120 + Math.max(0, ...columns.map((c) => c.length)) * ROW + Math.floor(i / perRow) * ROW,
    });
  });
  const height = 140 + Math.max(0, ...columns.map((c) => c.length)) * ROW +
                 Math.ceil(cx.length / perRow) * ROW;
  const width = Math.max(x, perRow * (W + GAP) + 30);
  return { nodes, edges, pos, W, H, height, width };
}

function truncate(s, n) { s = String(s ?? ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; }

function renderGraph() {
  layout = computeLayout();
  if (!layout) {
    document.getElementById("graph-wrap").innerHTML =
      `<p style="padding:16px" class="muted">Risk map UNAVAILABLE — nothing to draw.</p>`;
    return;
  }
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  const { nodes, edges, pos, W, H, height, width } = layout;
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.setAttribute("width", String(Math.min(width, 1180)));
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "Recorded risk map graph");

  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
     markerWidth="7" markerHeight="7" orient="auto-start-reverse">
     <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7681"></path></marker>`;
  svg.appendChild(defs);
  const title = document.createElementNS(NS, "text");
  title.setAttribute("class", "lagend"); title.setAttribute("x", "14"); title.setAttribute("y", "22");
  title.textContent = "Recorded risk map — decision facts (top) + cross-resource context (bottom). Both endpoint labels: OBSERVED solid blue · INFERRED dashed amber.";
  svg.appendChild(title);

  for (const e of edges) {
    const a = pos.get(e.src), b = pos.get(e.dst);
    if (!a || !b) continue;
    const line = document.createElementNS(NS, "line");
    line.setAttribute("class", "ledge " + (e.support === "OBSERVED" ? "obs" :
      (e.support === "INFERRED" ? "inf" : "")));
    line.setAttribute("x1", String(a.x + W / 2)); line.setAttribute("y1", String(a.y + H));
    line.setAttribute("x2", String(b.x + W / 2)); line.setAttribute("y2", String(b.y));
    line.setAttribute("marker-end", "url(#arrow)");
    line.dataset.src = e.src; line.dataset.dst = e.dst;
    const lbl = document.createElementNS(NS, "title");
    lbl.textContent = `${e.relation}${e.support ? " (" + e.support + ")" : ""}`;
    line.appendChild(lbl);
    svg.appendChild(line);
  }
  for (const n of nodes) {
    const p = pos.get(n.node_id); if (!p) continue;
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "lnode");
    g.dataset.id = n.node_id;
    const rect = document.createElementNS(NS, "rect");
    rect.setAttribute("x", String(p.x)); rect.setAttribute("y", String(p.y));
    rect.setAttribute("width", String(W)); rect.setAttribute("height", String(H));
    rect.setAttribute("rx", "9");
    rect.setAttribute("stroke", NODE_COLORS[nodeClass(n.kind, n.node_id)]);
    g.appendChild(rect);
    const t1 = document.createElementNS(NS, "text");
    t1.setAttribute("x", String(p.x + 10)); t1.setAttribute("y", String(p.y + 19));
    t1.textContent = truncate(n.title || n.node_id, 26);
    g.appendChild(t1);
    const t2 = document.createElementNS(NS, "text");
    t2.setAttribute("x", String(p.x + 10)); t2.setAttribute("y", String(p.y + 36));
    t2.setAttribute("fill", "#9aa7b4");
    t2.textContent = truncate(n.node_id, 28);
    g.appendChild(t2);
    const tip = document.createElementNS(NS, "title");
    tip.textContent = `${n.title}\n${n.node_id}\n${n.state || ""}`;
    g.appendChild(tip);
    g.addEventListener("click", (ev) => { ev.stopPropagation(); selectNode(n.node_id); });
    svg.appendChild(g);
  }
  const wrap = document.getElementById("graph-wrap");
  wrap.textContent = ""; wrap.appendChild(svg);
  document.getElementById("graph-stats").textContent =
    `${layout.nodes.length} uniquely identified nodes · ${layout.edges.length} edges · ` +
    `duplicates refused: ${((D.sections.risk_map.nodes || []).length) - layout.nodes.length}`;
  wireGraphButtons();
}

function wireGraphButtons() {
  document.getElementById("zoom-in").onclick = () => { zoom = Math.min(2.6, zoom * 1.25); applyZoom(); };
  document.getElementById("zoom-out").onclick = () => { zoom = Math.max(0.4, zoom / 1.25); applyZoom(); };
  document.getElementById("zoom-reset").onclick = () => { zoom = 1; applyZoom(); };
  document.getElementById("graph-clear").onclick = () => { selectNode(null); };
  addEventListener("keydown", (ev) => { if (ev.key === "Escape") selectNode(null); });
}
function applyZoom() {
  const svg = document.querySelector("#graph-wrap svg");
  if (!svg) return;
  svg.style.transform = `scale(${zoom})`;
  svg.style.transformOrigin = "top left";
}

function selectNode(id) {
  selectedNode = id;
  const detail = document.getElementById("graph-detail");
  const svg = document.querySelector("#graph-wrap svg");
  if (!layout || !svg) return;
  for (const g of svg.querySelectorAll(".lnode")) {
    g.classList.toggle("sel", g.dataset.id === id);
  }
  const touching = new Set();
  for (const line of svg.querySelectorAll(".ledge")) {
    const hot = id && (line.dataset.src === id || line.dataset.dst === id);
    line.classList.toggle("hot", Boolean(hot));
    line.classList.toggle("dim", Boolean(id && !hot));
    if (hot) { touching.add(line.dataset.src); touching.add(line.dataset.dst); }
  }
  for (const g of svg.querySelectorAll(".lnode")) {
    g.classList.toggle("dim", Boolean(id && !touching.has(g.dataset.id)));
  }
  if (!id) {
    detail.innerHTML = `<h2>Node details</h2><span class="muted">Select a node in the graph.</span>`;
    return;
  }
  const node = layout.nodes.find((n) => n.node_id === id);
  const related = layout.edges.filter((e) => e.src === id || e.dst === id);
  detail.innerHTML = `
    <h2>Node details</h2>
    ${chip(node.kind, "chip acc")} ${chip(node.severity || "—")}
    ${node.support ? chip("support: " + node.support) : ""}
    ${kv([
      ["node id", `<code>${escapeHtml(node.node_id)}</code>`],
      ["title", escapeHtml(node.title || "")],
      ["state", escapeHtml(node.state || "")],
    ])}
    ${sub("Edges touching this node")}
    ${related.length ? `<ul class="tight">${related.map((e) =>
      `<li>${escapeHtml(e.src)} <b>${escapeHtml(e.relation)}</b> ${escapeHtml(e.dst)}${e.support ? " " + escapeHtml(e.support) : ""}</li>`).join("")}</ul>`
      : `<p class="muted">No edges recorded for this node.</p>`}
    ${sub("Recorded payload")}
    <pre>${escapeHtml(JSON.stringify(node, null, 2))}</pre>`;
}

/* ---------- what-if tab ---------- */
function sim() { return (D.sections && D.sections.simulation) || null; }

function renderWhatIf() {
  const el = document.getElementById("tab-whatif");
  const s = sim();
  if (!s) { el.innerHTML = missing("Simulation"); return; }
  const factors = s.cross_resource_factors || [];
  const proj = s.obligation_projections || [];
  const eff = s.projected_provider_effects || [];
  el.innerHTML = `
      <div class="banner">HYPOTHETICAL — every projected value shown on this tab is
      PROJECTED_NOT_OBSERVED. ${escapeHtml(String(s.banner || ""))}</div>
  <div class="grid">
    <div>
      <div class="card">
        <h2>"What if we retire this?" — pick a resource</h2>
        <p class="muted">The page shows <b>precomputed deterministic factors</b> from
        the recorded simulation; it runs no engine, observes nothing and has no
        execute button by design.</p>
        <select id="wi-select">
          <option value="">— select a resource —</option>
          ${assets().map((a) =>
            `<optgroup label="${escapeHtml(a.project_id + " — " + (a.full_path || ""))}">` +
            (a.resources || []).map((r) =>
              `<option value="${escapeHtml(r.ref)}"${selectedResource === r.ref ? " selected" : ""}>
                ${escapeHtml(r.kind + " · " + r.ref + " · " + r.state)}</option>`).join("") +
            `</optgroup>`).join("")}
        </select>
        <div id="wi-factors"></div>
      </div>
      <div class="card">
        <h2>Projected provider effects of the single authorized endpoint</h2>
        ${eff.length ? eff.map((f) => `
          <div class="factor">${chip(f.state || "PROJECTED_NOT_OBSERVED")}
            <div>${escapeHtml(f.effect || "")}</div></div>`).join("")
          : `<p class="muted">None recorded.</p>`}
        ${sub("Redeployment risk")}<p>${chip(s.redeployment_risk || "—")}</p>
      </div>
    </div>
    <div>
      <div class="card">
        <h2>Obligation projections (precomputed)</h2>
        ${proj.length ? `<table><tr><th>obligation</th><th>now</th><th>projected</th><th>why</th></tr>
          ${proj.map((p) => `<tr>
            <td>${escapeHtml(p.obligation_id || "")}</td>
            <td>${chip(p.status || "")}</td>
            <td>${chip(p.projected || "")}</td>
            <td>${escapeHtml(p.consequence || "")}</td></tr>`).join("")}</table>`
          : `<p class="muted">No projections recorded.</p>`}
      </div>
      <div class="card">
        <h2>Cross-resource factors (same observed portfolio evidence)</h2>
        <p class="muted">${factors.length} factors; all labelled
        ${chip("PROJECTED_NOT_OBSERVED", "chip amber")} — projections never create
        eligibility or mint verdicts.</p>
        <div id="wi-all-factors">
        ${factors.map((f) => `
          <div class="factor">${chip(f.state, "chip amber")}
            <div><b>${escapeHtml(f.kind)}</b> <span class="ref" style="font-family:Consolas,monospace;color:var(--accent)">${escapeHtml(f.resource)}</span></div>
            <div class="muted">observed ${escapeHtml(f.observed_at || "")} → fresh until ${escapeHtml(f.fresh_until || "")}</div>
            <div>${escapeHtml(f.projection || "")}</div>
          </div>`).join("")}
        </div>
      </div>
    </div>
  </div>`;
  const sel = document.getElementById("wi-select");
  sel.addEventListener("change", () => {
    selectedResource = sel.value || null;
    const box = document.getElementById("wi-factors");
    if (!sel.value) { box.innerHTML = ""; return; }
    const matching = factors.filter((f) => f.resource === sel.value);
    const isPages = sel.value.startsWith("pages");
    box.innerHTML = matching.length ? matching.map((f) => `
      <div class="factor">${chip(f.state, "chip amber")}
        <div><b>${escapeHtml(f.kind)}</b> ${escapeHtml(f.resource)}</div>
        <div>${escapeHtml(f.projection || "")}</div></div>`).join("")
      : (isPages
        ? `<div class="factor">${chip("NOT_RUN")}
           <div>The authorized action acts on the Pages resource itself — a live
           unpublish has <b>not been run</b> (no credential, no execution). Any
           post-action state must come from a fresh provider read, never from
           this page.</div></div>`
        : `<div class="factor">${chip("NOT_OBSERVED (NO MATCHING FACTOR)", "chip dim")}
           <div>No recorded projection factor for this reference. Nothing is
           invented here.</div></div>`);
  });
}

/* ---------- proof tab ---------- */
function renderProof() {
  const el = document.getElementById("tab-proof");
  const sec = D.sections || {};
  const duo = (D.external_evidence && D.external_evidence.duo_session) || null;
  const gates = D.authorization_gates || [];
  el.innerHTML = `
  <div class="grid">
    <div>
      <div class="card"><h2>Authorization gates</h2>
        ${gates.map((g) => `${chip(g.state)}
          <div><b>${escapeHtml(g.gate)}</b></div><div class="muted">${escapeHtml(g.detail)}</div><p></p>`).join("")}
      </div>
      <div class="card">${proofCapsule(sec.capsule)}</div>
      <div class="card">${witnessCard(sec.witness)}</div>
      ${sec.receipt && sec.receipt.receipt_state ? receiptCard(sec.receipt) : `
        <div class="card"><h2>Retirement receipt</h2>${chip("UNAVAILABLE", "chip dim")}
        <div class="muted">The receipt section was not supplied to the builder;
        nothing about a mutation is assumed here.</div></div>`}
    </div>
    <div>
      ${sec.decision && sec.decision.verdict ? decisionCard(sec.decision) : missing("Decision")}
      <div class="card">${supervisedReviewCard(sec.supervised_review)}</div>
      <div class="card"><h2>External evidence — GitLab Duo session 9671626</h2>
        ${duo ? duoLadder(duo) : missing("Duo session evidence")}
      </div>
      <div class="card">${duoReconciliationCard(sec.duo_reconciliation)}</div>
      <div class="card"><h2>Escaping self-test</h2>
        <p class="muted">The raw string below is rendered as inert text (not as
        HTML) to demonstrate that provider-shaped content is always escaped:</p>
        <pre>${escapeHtml(JSON.stringify(D.escape_probe || "", null, 0))}</pre>
        <div id="escape-probe"></div>
      </div>
    </div>
  </div>`;
  const probe = document.getElementById("escape-probe");
  probe.textContent = D.escape_probe || "";
  probe.className = "muted";
}

function proofCapsule(c) {
  return `<h2>Proof capsule</h2>
    ${c && c.sections ? chip("RECORDED") : chip("UNAVAILABLE", "chip dim")}
    ${!(c && c.sections) ? `<div class="muted">Capsule artifact was not supplied; it is not invented here.</div>` : ""}
    ${c && c.sections ? kv([
      ["schema", escapeHtml(c.schema || "—")],
      ["capsule id", `<code>${escapeHtml(c.capsule_id || "")}</code>`],
      ["verify", `<code>${escapeHtml((D.verify || {}).command || "—")}</code>`],
      ["note", escapeHtml((D.verify || {}).note || "")],
    ]) : ""}
    ${c && c.sections ? `
    <table><tr><th>section</th><th>state</th></tr>
    ${Object.entries(c.sections).map(([k, v]) =>
      `<tr><td>${escapeHtml(k)}</td><td>${chip((v && v.state) || "—")}</td></tr>`).join("")}
    </table>` : ""}`;
}
function receiptCard(rc) {
  /* QA-FIX D: the truth state comes from the build-time fail-closed classifier.
     Schema presence alone is never evidence; acceptance is never absence. */
  const r = rc.record || {};
  const state = rc.receipt_state || "INVALID";
  const recordedOnly = state !== "NOT_RUN" && state !== "INVALID";
  return `<div class="card"><h2>Retirement receipt${recordedOnly ? " (recorded artifact)" : ""}</h2>${chip(state)}
    ${rc.recorded_verdict && rc.recorded_verdict !== state ? chip("recorded verdict: " + rc.recorded_verdict) : ""}
    ${kv([
      ["schema", escapeHtml(r.schema || "—")],
      ["action", escapeHtml(r.action || "—")],
      ["target project", escapeHtml((r.target || {}).project_id ?? "—")],
      ["mutation attempted", escapeHtml(String(rc.mutation_attempted))],
      ["mutation accepted", escapeHtml(String(rc.mutation_accepted))],
    ])}
    <div class="muted">${escapeHtml(rc.note || "")}</div>
    ${state === "NOT_RUN" ? `<div class="muted">No live mutation receipt exists: the
    runtime never executed the destructive step, and this page will not pretend
    otherwise.</div>` : ""}
  </div>`;
}
function duoReconciliationCard(rc) {
  if (!rc || !rc.claims) {
    return `<h2>Duo claim reconciliation</h2>${chip("UNAVAILABLE", "chip dim")}
      <div class="muted">No recorded reconciliation was supplied; nothing about the
      Duo session output is assumed here.</div>`;
  }
  const totals = rc.totals || {};
  return `<h2>Duo claim reconciliation — candidate claims only</h2>
    ${chip("authority: " + (rc.authority || "—"))} ${chip("session " + (rc.duo_session_id || "—"))}
    <p>${Object.entries(totals).map(([k, v]) => chip(k + ": " + v)).join(" ")}</p>
    <table><tr><th>claim</th><th>status</th><th>evidence note</th></tr>
    ${(rc.claims || []).map((c) => `<tr>
      <td><b>${escapeHtml(c.claim_id)}</b><br><span class="muted">${escapeHtml(c.text)}</span></td>
      <td>${chip(c.status)}</td>
      <td class="muted">${escapeHtml(c.detail)}</td></tr>`).join("")}
    </table>
    <div class="muted">${escapeHtml(rc.boundary || "")}</div>`;
}
function supervisedReviewCard(sr) {
  if (!sr || !sr.steps) {
    return `<h2>Supervised retirement review &amp; AI boundary</h2>${chip("UNAVAILABLE", "chip dim")}
      <div class="muted">Supervised review record was not supplied; the causal chain from Duo to deterministic decisions is not assembled here.</div>`;
  }
  const cf = sr.counterfactual || {};
  const steps = sr.steps || [];
  const claims = sr.candidate_claims || [];
  return `<h2>Supervised retirement review &amp; AI boundary</h2>
    <div class="banner">AI proposes candidate claims; deterministic engine owns authorization and verdicts</div>
    ${sub("Multi-step causal review pipeline")}
    <table><tr><th>step</th><th>autonomy</th><th>status</th><th>detail &amp; provenance</th></tr>
    ${steps.map((s) => `<tr>
      <td><b>${escapeHtml(s.title || s.step_id)}</b><br><code class="muted">${escapeHtml(s.step_id)}</code></td>
      <td>${chip(s.autonomy)}</td>
      <td>${chip(s.status)}</td>
      <td><div>${escapeHtml(s.detail || "")}</div>
          <div class="muted">provenance: ${escapeHtml(s.provenance || "—")} · in: ${escapeHtml((s.input_refs||[]).join(", "))} · out: ${escapeHtml(s.output_ref || "—")}</div></td></tr>`).join("")}
    </table>

    ${sub("Candidate claim corroboration matrix")}
    <table><tr><th>claim</th><th>origin</th><th>proj</th><th>relevance</th><th>corroboration</th><th>evidence note</th></tr>
    ${claims.map((c) => `<tr>
      <td><b>${escapeHtml(c.claim_id)}</b><br><span class="muted">${escapeHtml(c.text)}</span></td>
      <td><span class="muted">${escapeHtml(c.origin)}</span></td>
      <td><code>${escapeHtml(c.source_project != null ? c.source_project : "—")}</code></td>
      <td>${chip(c.retirement_relevance)}</td>
      <td>${chip(c.corroboration_status)}</td>
      <td class="muted">${escapeHtml(c.corroboration_source ? c.corroboration_source + ": " : "")}${escapeHtml(c.corroboration_detail || "")}</td></tr>`).join("")}
    </table>

    ${sub("Counterfactual analysis — AI contribution vs deterministic verdict")}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0;">
      <div style="background:var(--panel2);padding:8px 12px;border-radius:6px;border:1px solid var(--line);">
        <div><b>With Duo candidate:</b> ${chip(cf.verdict_with_candidate || "—")}</div>
        <div class="muted">Investigation queue: enriched (material source claims)</div>
        <div class="muted">Risk explanation: enriched (CI redeployment mechanics)</div>
      </div>
      <div style="background:var(--panel2);padding:8px 12px;border-radius:6px;border:1px solid var(--line);">
        <div><b>Without Duo candidate:</b> ${chip(cf.verdict_without_candidate || "—")}</div>
        <div class="muted">Investigation queue: baseline</div>
        <div class="muted">Risk explanation: baseline</div>
      </div>
    </div>
    ${kv([
      ["deterministic verdict changed", chip(String(cf.deterministic_verdict_changed))],
      ["investigation queue changed", chip(String(cf.investigation_queue_changed))],
      ["risk explanation changed", chip(String(cf.risk_explanation_changed))],
      ["obligation trace changed", chip(String(cf.obligation_trace_changed))],
      ["corroboration work changed", chip(String(cf.corroboration_work_changed))],
    ])}
    <div class="muted" style="margin-top:6px;">${escapeHtml(cf.summary || "")}</div>`;
}
function witnessCard(w) {
  if (!w || !w.resurrection_possible) {
    return `<h2>Resurrection counterexample witness</h2>${chip("UNAVAILABLE", "chip dim")}
      <div class="muted">No witness record was supplied; resurrection paths are not
      assumed away.</div>`;
  }
  const t = w.target || {};
  const cfg = w.config || {};
  return `<h2>Resurrection counterexample witness</h2>
    ${chip(w.resurrection_possible)}
    ${chip("absence_claim: " + (w.absence_claim || "—"))}
    ${chip("resurrection_controlled: " + (w.resurrection_controlled || "—"))}
    ${kv([
      ["target", `<code>${escapeHtml(t.project_id || "")}</code> ${escapeHtml(t.full_path || "")}`],
      ["default branch @ commit", escapeHtml(String(w.default_branch)) + " @ " + escapeHtml(String(w.commit_sha))],
      ["config signals", escapeHtml(JSON.stringify(cfg.signals || []))],
      ["config complete", escapeHtml(String(cfg.configuration_complete))],
    ])}
    <div class="muted">${escapeHtml((w.pages_administration || {}).phrase || "")}</div>
    <h3>Counterexamples — what could still resurrect it</h3>
    <ul class="tight">${(w.counterexamples || []).map((c) => `<li>${escapeHtml(c)}</li>`).join("")}</ul>`;
}
function decisionCard(d) {
  return `<div class="card"><h2>Deterministic decision</h2>${chip(d.verdict)}
    ${kv([
      ["target", `<code>${escapeHtml((d.target || {}).project_id || "")}</code> ${escapeHtml((d.target || {}).full_path || "")}`],
      ["action", escapeHtml(d.action || "")],
    ])}
    ${sub("Why")}<ul class="tight">${(d.reasons || []).map((r) =>
      `<li>${escapeHtml(r.code || "")} — ${escapeHtml(r.explanation || "")}</li>`).join("")}</ul>`;
}
function duoLadder(duo) {
  const rows = [["Independently observed (anonymous API)", duo.evidence_ladder && duo.evidence_ladder.independently_observed_anonymous_api, "chip ok"],
    ["Operator-confirmed only", duo.evidence_ladder && duo.evidence_ladder.operator_confirmed_only, "chip amber"],
    ["Not independently observable & never promoted", duo.evidence_ladder && duo.evidence_ladder.not_independently_observable_and_never_promoted, "chip bad"]];
  return `
    ${kv([
      ["flow item", escapeHtml(duo.flow_catalog_item_id || "—")],
      ["session", escapeHtml((duo.duo_session || {}).session_id || "—") + " " + chip((duo.duo_session || {}).status || "—")],
      ["source issue", `#${escapeHtml((duo.issue_binding || {}).issue_iid || "—")} on project ${escapeHtml((duo.issue_binding || {}).project_id || "—")}`],
      ["captured", escapeHtml(duo.captured_at_utc || "—")],
    ])}
    ${rows.map(([head, items, cls]) => `
      ${sub(head)}
      <ul class="tight">${(items || []).map((i) => `<li>${escapeHtml(i)}</li>`).join("")}</ul>`).join("")}
    <div class="banner">${escapeHtml(duo.determinism_boundary || "")}</div>`;
}

/* ---------- footer & wiring ---------- */
function renderFooter() {
  const ic = D.interactive_contract || {};
  document.getElementById("footer").innerHTML = `
    <b>Static page contract:</b> ${escapeHtml(String(ic.page_is_static))} static ·
    network fetches at view time: <b>${escapeHtml(String(ic.network_fetches_at_view_time))}</b> ·
    destructive buttons: <b>${escapeHtml(String(ic.destructive_buttons))}</b><br>
    ${escapeHtml(ic.note || "")}
    <p>${(D.boundaries || []).map((b) => "⚠ " + escapeHtml(b)).join("<br>")}</p>
    <p data-probe="rendered">${escapeHtml(String(D.escape_probe || ""))}</p>`;
}

document.querySelectorAll(".tabbtn").forEach((b) =>
  b.addEventListener("click", () => {
    document.querySelectorAll(".tabbtn").forEach((x) => x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    const panel = document.getElementById("tab-" + b.dataset.tab);
    panel.classList.add("active");
    if (b.dataset.tab === "graph" && !layout) renderGraph();
  }));

renderHeader();
renderPortfolio();
renderWhatIf();
renderProof();
renderFooter();
</script>
