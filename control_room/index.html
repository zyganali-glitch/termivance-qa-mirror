<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Termivance Control Room</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d; --ink: #e6edf3;
    --dim: #9aa7b4; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
    --accent: #58a6ff; --caution: #db6d28;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { padding: 18px 28px; border-bottom: 1px solid var(--line); display: flex;
           align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 19px; margin: 0; letter-spacing: .3px; }
  .chip { display: inline-block; padding: 3px 12px; border-radius: 999px;
          font-size: 12.5px; font-weight: 600; border: 1px solid var(--line); }
  .chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); }
  .chip.bad { color: var(--bad); } .chip.dim { color: var(--dim); }
  .chip.accent { color: var(--accent); }
  main { display: grid; grid-template-columns: 1.2fr .8fr; gap: 16px; padding: 16px 28px; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase;
             letter-spacing: 1.2px; color: var(--dim); }
  .verdict { font-size: 30px; font-weight: 700; margin: 4px 0 6px; }
  .sub { color: var(--dim); font-size: 13px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line);
           vertical-align: top; }
  th { color: var(--dim); font-weight: 600; font-size: 12px; letter-spacing: .6px; }
  code { background: #0b0f14; border: 1px solid var(--line); padding: 1px 6px;
         border-radius: 4px; font-size: 12.5px; color: #a5d6ff; }
  .state { font-weight: 700; }
  .s-BLOCKED, .s-RESURRECTION_NOT_CONTROLLED, .s-HIGH { color: var(--bad); }
  .s-NOT_RUN, .s-NOT_OBSERVED, .s-UNKNOWN, .s-INCONCLUSIVE, .s-MEDIUM { color: var(--warn); }
  .s-COMPLETE, .s-SATISFIED, .s-OBSERVED_ABSENT, .s-RETIRED, .s-LOW, .s-DEPLOYMENT_PRESENT
    { color: var(--ok); }
  footer { padding: 10px 28px 26px; color: var(--dim); font-size: 12.5px; }
  ul { margin: 6px 0; padding-left: 20px; }
  li { margin: 2px 0; }
  .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px; }
  .pill { border-radius: 6px; padding: 1px 8px; font-size: 12px;
          border: 1px solid var(--line); display: inline-block; margin: 1px 3px 1px 0; }
</style>
</head>
<body>
<header>
  <h1>Termivance Control Room</h1>
  <span id="provenance" class="chip accent"></span>
  <span id="verdict-chip" class="chip dim"></span>
  <span class="chip dim" id="built-at"></span>
</header>
<main>
  <div>
    <section class="card" id="card-target">
      <h2>Target &amp; verdict</h2>
      <div id="target-body"></div>
    </section>
    <section class="card" id="card-portfolio">
      <h2>Portfolio (read-only)</h2>
      <div id="portfolio-body"></div>
    </section>
    <section class="card" id="card-simulation">
      <h2>Simulation — what if we retire this?</h2>
      <div id="simulation-body"></div>
    </section>
  </div>
  <div>
    <section class="card" id="card-risk">
      <h2>Risk map</h2>
      <div id="risk-body"></div>
    </section>
    <section class="card" id="card-receipt">
      <h2>One real flow — receipt &amp; capsule</h2>
      <div id="receipt-body"></div>
    </section>
    <section class="card" id="card-workflow">
      <h2>Workflow stages</h2>
      <div id="workflow-body"></div>
    </section>
  </div>
</main>
<footer>
  <div id="boundaries"></div>
  <div style="margin-top:8px"><strong>Verify in 60s:</strong> <code id="verify-cmd"></code>
    <span class="sub" id="verify-note"></span></div>
</footer>
<script src="data.js"></script>
<script>
(function () {
  const D = window.TERMIVANCE_DATA || {};
  const S = D.sections || {};
  const $ = (id) => document.getElementById(id);

  const chip = (text, cls) => `<span class="chip ${cls || "dim"}">${text}</span>`;
  const stateChip = (value) => `<span class="state s-${value}">${value}</span>`;

  $("provenance").textContent = (D.provenance_label || "NO_DATA") + (D.built_at ? "" : "");
  $("built-at").textContent = D.built_at ? "built " + D.built_at.replace("T", " ").slice(0, 19) + "Z" : "";

  // --- decision ------------------------------------------------------------
  const dec = S.decision || {};
  const verdict = dec.verdict || "NOT_OBSERVED";
  $("verdict-chip").textContent = "verdict: " + verdict;
  $("verdict-chip").className = "chip " +
    (verdict === "SAFE_TO_RETIRE" ? "ok" : verdict === "BLOCKED" ? "bad" : "warn");
  let t = dec.target || {};
  $("target-body").innerHTML =
    `<div class="verdict">${verdict}</div>` +
    `<div class="sub">project ${t.project_id ?? "?"} — ${t.full_path ?? "?"} ` +
    `<span class="chip dim">${t.resource_kind ?? ""}</span></div>` +
    (dec.reasons || []).map(r =>
      `<div class="sub">• <span class="state s-HIGH">${r.code}</span> — ${r.detail || ""}</div>`).join("");
  if (S.receipt && S.receipt.target) {
    t = S.receipt.target;
    $("target-body").innerHTML +=
      `<div class="sub" style="margin-top:6px">receipt: mutation ` +
      `${S.receipt.mutation_attempted === true ? stateChip("ATTEMPTED") : stateChip("NOT_ATTEMPTED")}` +
      `</span> ledger: <span class="mono">${S.receipt.ledger_path || "—"}</span></div>`;
  }

  // --- portfolio -----------------------------------------------------------
  const pf = S.portfolio || {};
  if (pf.assets) {
    $("portfolio-body").innerHTML =
      `<div class="sub">${pf.provenance || ""}</div><table><tr><th>ID</th><th>Role</th>` +
      `<th>Pages</th><th>Path</th></tr>` +
      pf.assets.map(a => `<tr><td>${a.project_id}</td><td>${a.role}</td>` +
        `<td>${stateChip(a.pages_state)}</td><td class="mono">${a.full_path}</td></tr>`).join("") +
      `</table><div class="sub">totals: ${JSON.stringify(pf.totals)}</div>`;
  } else { $("portfolio-body").innerHTML = stateChip(NOT_OBSERVED); }

  // --- risk map ------------------------------------------------------------
  const rm = S.risk_map || {};
  if (rm.nodes) {
    $("risk-body").innerHTML =
      `<table><tr><th>Severity</th><th>Risk</th></tr>` +
      rm.nodes.filter(n => n.kind !== "CONTROL").slice(0, 8)
        .map(n => `<tr><td>${stateChip(n.severity)}</td><td>${n.title}` +
          `<div class="sub">${n.state || ""}</div></td></tr>`).join("") +
      `</table>`;
  } else { $("risk-body").innerHTML = stateChip(NOT_OBSERVED); }

  // --- receipt / capsule ---------------------------------------------------
  const rc = S.receipt || {}, cp = S.capsule || {};
  let receiptHtml = stateChip(rc.state || "NOT_OBSERVED");
  if (rc.verdict !== undefined) {
    const mu = rc.mutation || {};
    receiptHtml =
      `<div>executor verdict: <span class="verdict" style="font-size:20px">${rc.verdict}</span></div>` +
      `<div class="sub">mutation ${mu.method || "—"} ${mu.endpoint || "—"} → ` +
      `HTTP ${mu.status ?? "—"} (${mu.accepted === true ? "accepted" : "refused"})</div>` +
      `<div class="sub">operation <span class="mono">${rc.operation_id || "—"}</span> · ` +
      `attempted ${rc.mutation_attempted === true ? "yes" : "no"}</div>`;
  }
  if (cp.manifest_digest) {
    receiptHtml += `<div style="margin-top:6px">capsule ${chip("integrity verifiable", "ok")}` +
      `<div class="mono">sha256 ${cp.manifest_digest.slice(0, 32)}…</div></div>`;
  }
  $("receipt-body").innerHTML = receiptHtml;
  const ab = (S.receipt && S.receipt.absence) || {};
  if (ab.verdict) {
    $("receipt-body").innerHTML +=
      `<div class="sub" style="margin-top:6px">bounded absence: ${stateChip(ab.verdict)} ` +
      `<span class="mono">api=${(ab.pages_api && ab.pages_api.status) ?? "—"} ` +
      `http=${(ab.served_url && ab.served_url.http_status) ?? "—"}</span></div>`;
  }

  // --- simulation ----------------------------------------------------------
  const sim = S.simulation || {};
  if (sim.obligation_projections) {
    $("simulation-body").innerHTML =
      `<div class="sub">${sim.banner || ""}</div><table><tr><th>Obligation</th>` +
      `<th>Now</th><th>Projected</th></tr>` +
      sim.obligation_projections.map(p =>
        `<tr><td>${p.obligation_kind}</td><td>${stateChip(p.current_status)}</td>` +
        `<td>${p.projected_status}</td></tr>`).join("") + `</table>` +
      `<div class="sub">${sim.redeployment_risk || ""}</div>`;
  } else {
    $("simulation-body").innerHTML = stateChip(NOT_OBSERVED) +
      `<div class="sub">run <code>termivance simulate --project-id &lt;id&gt;</code></div>`;
  }

  // --- workflow ------------------------------------------------------------
  const wf = S.workflow || {};
  if (wf.stages) {
    $("workflow-body").innerHTML =
      wf.stages.map(s =>
        `<div><span class="pill">${s.state}</span> <strong>${s.stage}</strong>` +
        `<div class="sub">${s.detail || ""}</div></div>`).join("");
  } else { $("workflow-body").innerHTML = stateChip(NOT_OBSERVED); }
  const tw = S.tripwire || {};
  if (tw.state) {
    $("workflow-body").innerHTML +=
      `<div style="margin-top:8px">tripwire: ${stateChip(tw.state)} ` +
      `<div class="sub">${tw.explanation || ""}</div></div>`;
  }

  // --- boundaries / verify -------------------------------------------------
  $("boundaries").innerHTML = (D.boundaries || []).map(b => `<div>⚠ ${b}</div>`).join("");
  $("verify-cmd").textContent = (D.verify && D.verify.command) || "";
  $("verify-note").textContent = "— " + ((D.verify && D.verify.note) || "");
})();
</script>
</body>
</html>
